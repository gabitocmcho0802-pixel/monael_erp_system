<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monael ERP | Eliminar Producto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
        }
        .card {
            background-color: #111827;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            padding: 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; color: #ef4444; }
        h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-group { display: flex; justify-content: center; gap: 0.75rem; }
        .btn { padding: 0.65rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🗑️</div>
        <h2>¿Eliminar Producto?</h2>
        <p>¿Estás seguro de que deseas eliminar permanentemente <strong>"{{ object.nombre }}"</strong> ({{ object.codigo }})?</p>
        <form method="POST">
            {% csrf_token %}
            <div class="btn-group">
                <a href="{% url 'productos_lista' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sí, Confirmar</button>
            </div>
        </form>
    </div>
</body>
</html>
